services:

  user-service:
    build: ./user-service
    networks:
      - capstone

  product-service:
    build: ./product-service
    networks:
      - capstone

  order-service:
    build: ./order-service
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      - product-service
    networks:
      - capstone

  notification-service:
    build: ./notification-service
    environment:
      ORDER_SERVICE_URL: http://order-service:8083
    depends_on:
      - order-service
    networks:
      - capstone

  api-gateway:
    build: ./api-gateway
    environment:
      USER_SERVICE_URL:         http://user-service:8081
      PRODUCT_SERVICE_URL:      http://product-service:8082
      ORDER_SERVICE_URL:        http://order-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      - user-service
      - product-service
      - order-service
      - notification-service
    ports:
      - "8080:8080"
    networks:
      - capstone

networks:
  capstone:
    driver: bridge
